<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>手绘白板 · 网页请求</title>
<style>
@font-face{font-family:"LXGW WenKai";font-weight:400;src:local("LXGW WenKai"),url("assets/fonts/lxgw-wenkai/LXGWWenKai-Regular.ttf") format("truetype")}
@font-face{font-family:"LXGW WenKai";font-weight:700;src:local("LXGW WenKai Medium"),url("assets/fonts/lxgw-wenkai/LXGWWenKai-Medium.ttf") format("truetype")}
*{box-sizing:border-box}
body{margin:0;background:#e9e5da;color:#2b2b2b;font-family:"LXGW WenKai","霞鹜文楷","STKaiti","KaiTi","Microsoft YaHei",sans-serif}
button{font:inherit;cursor:pointer}
.top{padding:20px 32px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.top h1{font-size:20px;margin:0 0 4px}.top p{font-size:12px;color:#7a7568;margin:0}
.top button,.transport button{min-height:38px;padding:6px 16px;background:#fffdf7;border:2px solid #2b2b2b;border-radius:8px;color:#2b2b2b;white-space:nowrap}
.workspace{max-width:1560px;margin:auto;padding:0 32px 24px}
.stage{aspect-ratio:16/9;overflow:hidden;border-radius:6px;box-shadow:0 8px 24px #0002;background:#fbf7ee}
.full:fullscreen{background:#111;display:grid;place-items:center}
.full:fullscreen .stage{width:min(100vw,177.78vh);border-radius:0}
svg{width:100%;height:100%;display:block}
text{font-family:"LXGW WenKai","霞鹜文楷","STKaiti","KaiTi","Microsoft YaHei",sans-serif;fill:#2b2b2b}
.mono{font-family:"JetBrains Mono",Consolas,monospace;font-weight:700}
.ink{stroke:#2b2b2b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.ink:not([fill]){fill:none}
.ink2{fill:none;stroke:#2b2b2b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.12}
.paper{fill:#fffdf7}
.node{transition:none}
.step text{font-size:38px;fill:#9a9384}
.step .mk{opacity:0}
.step.on text{fill:#2b2b2b;font-weight:700}.step.on .mk{opacity:.95}
.step.done text{fill:#777164}
.note text{font-size:42px;fill:#d9480f;font-weight:700}
.transport{display:flex;align-items:center;gap:14px;padding:18px 0;font-size:13px;color:#6f6a5d}
.transport input{accent-color:#2b2b2b}
.transport input[type="range"]{flex:1;min-width:0}
.transport output{min-width:90px;font-variant-numeric:tabular-nums}
.full:fullscreen .transport{display:none}
@media(max-width:700px){
 .top{padding:16px;flex-wrap:wrap}
 .workspace{padding:0 16px 20px}
 .transport{flex-wrap:wrap;gap:12px}
 .transport input[type="range"]{flex:1 1 140px}
}
</style>
<header class="top"><div><h1>手绘白板 · 网页请求</h1><p>橙色表示请求，蓝色表示返回数据；随讲解突出当前步骤</p></div><button id="fs">全屏看画面</button></header>
<main class="workspace">
<div class="full"><div class="stage" id="hero"></div></div>
<div class="transport"><button id="play">播放</button><button id="restart">重播</button><input id="seek" type="range" min="0" max="12" step="0.01" value="0" aria-label="动画进度"><label style="white-space:nowrap"><input type="checkbox" id="subOn" checked style="flex:none"> 字幕</label><label style="white-space:nowrap"><input type="checkbox" id="boilOn" style="flex:none"> 线条抖动</label><output id="time">0.0 / 12 秒</output></div>
<p id="player-status" role="status" style="color:#9b341b;font-size:14px"></p></main>
<script>
window.videoReady=(async()=>{
// 来自新配音真实字时间与分段采样位置，无整体变速或旧慢速换算。
const response=await fetch('timeline.json');if(!response.ok)throw new Error('请先生成配音和时间线');const NARRATION=await response.json();
const CUES=NARRATION.cues;
const INTRO=NARRATION.intro,TOTAL=NARRATION.duration,PHASES=NARRATION.phases,STEPS=['请求','检查','查询','取数','返回','更新'];
const ACTIVE=[['browser','backend'],['backend'],['backend','db'],['db','backend'],['backend','browser'],['browser']];
const OR='#f08c28',BL='#2f7fe0',YE='#ffd84d',Y1=480,Y2=610;
const ease=p=>p<0?0:p>1?1:p*p*(3-2*p);
const clamp=p=>Math.max(0,Math.min(1,p));
// [开始, 结束, 起点x, 终点x, y, 颜色, 标签]
const LEGS=NARRATION.legs;
// 每个阶段的批注：[x, y, 文字, 箭头终点x, 箭头终点y]
const NOTES=[[645,315,'带上 id=1'],[1275,315,'去 user 表里找'],[1275,778,'找到了！'],[645,778,'整理成 JSON'],[330,282,'页面更新啦'],[960,315,'检查参数']];
// 批注依据新配音中的对应词组出现；第六条用于检查参数阶段。
const NOTE_ST=NARRATION.notes;
// 提示与对应动作同时开始，完成提示在动作结束后出现；各窗口不重叠。
const noteOn=(i,t)=>t>=NARRATION.noteWindows[i][0]&&t<NARRATION.noteWindows[i][1];
const bx=160,sx=790,dx=1420,by=360;
// 手绘矩形：四边略弯
const wob=(x,y,w,h,r=10)=>`M${x+r} ${y+2}Q${x+w/2} ${y-3} ${x+w-r} ${y+1}Q${x+w+3} ${y+r} ${x+w-1} ${y+r+4}L${x+w+1} ${y+h-r}Q${x+w} ${y+h+2} ${x+w-r} ${y+h-1}Q${x+w/2} ${y+h+4} ${x+r} ${y+h}Q${x-3} ${y+h} ${x} ${y+h-r}L${x+2} ${y+r}Q${x} ${y} ${x+r} ${y+2}Z`;
// 双线描边：主线 + 一条错位的淡线，模拟铅笔重描
const sk=(d,extra='')=>`<path class="ink" d="${d}" ${extra}/><path class="ink2" d="${d}" transform="translate(2.5 1.5)"/>`;
const cyl=(x,y)=>`M${x} ${y+40}C${x} ${y-36} ${x+340} ${y-36} ${x+340} ${y+40}V${y+276}C${x+340} ${y+352} ${x} ${y+352} ${x} ${y+276}Z`;
const check=(id,cx,cy)=>`<g id="${id}" opacity="0"><circle class="ink" cx="${cx}" cy="${cy}" r="27" fill="#d6e8ff"/><path class="ink" d="M${cx-13} ${cy}l9 9 17-20" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" id="${id}-p" style="stroke-width:5"/></g>`;
function art(){
const defs=`<filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence id="turb" type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="1" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="roughT" x="-5%" y="-10%" width="110%" height="120%"><feTurbulence id="turbT" type="fractalNoise" baseFrequency="0.03" numOctaves="1" seed="1" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7"/><feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0.09 0"/></filter>
${NOTES.map((_,i)=>`<clipPath id="nc${i}"><rect id="ncr${i}" x="0" y="0" width="0" height="1080"/></clipPath>`).join('')}
<clipPath id="titlec"><rect id="titler" x="80" y="110" width="0" height="130"/></clipPath>
${[0,1,2].map(i=>`<clipPath id="lc${i}"><rect id="lcr${i}" x="0" y="750" width="0" height="90"/></clipPath>`).join('')}
<clipPath id="namec"><rect id="namer" x="${bx+140}" y="${by+90}" width="0" height="70"/></clipPath>`;
const browser=`<g class="node" id="n-browser"><path class="paper" d="${wob(bx,by,340,300)}"/>${sk(wob(bx,by,340,300))}${sk(`M${bx+3} ${by+56}Q${bx+170} ${by+52} ${bx+337} ${by+57}`)}<circle cx="${bx+30}" cy="${by+28}" r="6" fill="#2b2b2b"/><circle cx="${bx+52}" cy="${by+28}" r="6" fill="#2b2b2b"/><circle cx="${bx+74}" cy="${by+28}" r="6" fill="#2b2b2b"/><path class="ink" d="M${bx+110} ${by+28}Q${bx+200} ${by+24} ${bx+310} ${by+29}" style="stroke-width:3" opacity=".35"/>
<g id="ph"><path class="ink" d="${wob(bx+30,by+88,100,120,6)}" stroke-dasharray="9 9" opacity=".6"/><path class="ink" d="M${bx+155} ${by+104}Q${bx+230} ${by+100} ${bx+305} ${by+105}M${bx+155} ${by+136}Q${bx+210} ${by+134} ${bx+265} ${by+137}" opacity=".35"/><path class="ink" d="${wob(bx+155,by+208,120,44,6)}" opacity=".45"/><text x="${bx+215}" y="${by+240}" text-anchor="middle" font-size="24" style="fill:#8d8778">加载中…</text></g>
<g id="res" opacity="0"><circle class="ink" cx="${bx+80}" cy="${by+140}" r="48" fill="#d6e8ff"/><circle class="ink" cx="${bx+80}" cy="${by+126}" r="15" fill="#fffdf7"/><path class="ink" d="M${bx+50} ${by+168}Q${bx+50} ${by+144} ${bx+80} ${by+150}Q${bx+110} ${by+144} ${bx+110} ${by+168}" fill="#fffdf7"/>
<g clip-path="url(#namec)"><text x="${bx+150}" y="${by+140}" font-size="50" font-weight="700">小林</text></g><path class="ink" d="M${bx+150} ${by+170}Q${bx+225} ${by+166} ${bx+300} ${by+171}" opacity=".35"/><path class="ink" d="M${bx+150} ${by+200}Q${bx+200} ${by+197} ${bx+250} ${by+201}" opacity=".25"/></g>${check('okB',bx+300,by+256)}</g>`;
const rows=[0,1,2].map(i=>`<path class="ink" d="${wob(sx+24,by+24+i*90,292,68,6)}" fill="${i==0?'#fff1b8':'#fffdf7'}"/><circle cx="${sx+56}" cy="${by+58+i*90}" r="8" fill="#2b2b2b"/><path class="ink" d="M${sx+110} ${by+49+i*90}Q${sx+200} ${by+46+i*90} ${sx+292} ${by+50+i*90}M${sx+110} ${by+69+i*90}H${sx+250}" opacity=".45"/>`).join('');
const backend=`<g class="node" id="n-backend"><path class="paper" d="${wob(sx,by,340,300)}"/>${sk(wob(sx,by,340,300))}${rows}${check('okS',sx+336,by+2)}</g>`;
const db=`<g class="node" id="n-db"><path class="paper" d="${cyl(dx,by)}"/>${sk(cyl(dx,by))}<ellipse class="ink" cx="${dx+170}" cy="${by+40}" rx="170" ry="52" fill="#fff1b8"/>${sk(`M${dx} ${by+120}C${dx} ${by+190} ${dx+340} ${by+190} ${dx+340} ${by+120}M${dx} ${by+200}C${dx} ${by+270} ${dx+340} ${by+270} ${dx+340} ${by+200}`)}
<path id="rec" d="M${dx+40} ${by+200}Q${dx+170} ${by+214} ${dx+300} ${by+198}" stroke="${OR}" stroke-width="26" stroke-linecap="round" fill="none" opacity="0"/><text id="recT" class="mono" x="${dx+170}" y="${by+208}" text-anchor="middle" font-size="24" opacity="0">id=1 · 小林</text></g>`;
const legs=LEGS.map(([a,b,x1,x2,y,c],i)=>{const d=`M${x1} ${y}Q${(x1+x2)/2} ${y+(i%2?7:-7)} ${x2} ${y}`;const dir=x2>x1?1:-1;return `<g><path id="f${i}" d="${d}" stroke="${c}" stroke-width="7" stroke-linecap="round" fill="none" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/><path id="h${i}" d="M${x2-dir*24} ${y-17}L${x2+dir*2} ${y+1}L${x2-dir*22} ${y+19}" stroke="${c}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0"/></g>`}).join('');
const tags=LEGS.map(([a,b,x1,x2,y,c,l],i)=>{const mx=(x1+x2)/2,ty=y+(y===Y1?-48:70);return `<g id="t${i}" opacity="0"><text class="mono" x="${mx}" y="${ty}" text-anchor="middle" font-size="30" style="fill:${c}">${l}</text></g>`}).join('');
// 批注 = 红字 + 一支手画的小箭头，指向它说明的东西
const notes=NOTES.map(([x,y,txt],i)=>{const up=y<400,s=up?y+18:y-46,e=up?y+72:y-76,d=up?-1:1;return `<g class="note"><g clip-path="url(#nc${i})"><text x="${x}" y="${y}" text-anchor="middle" filter="url(#roughT)">${txt}</text></g><path id="na${i}" d="M${x} ${s}Q${x+18} ${(s+e)/2} ${x-4} ${e}M${x-17} ${e+d*13}L${x-4} ${e}L${x+11} ${e+d*12}" fill="none" stroke="#d9480f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" filter="url(#rough)"/></g>`}).join('');
const labels=[['浏览器',bx+170],['后端',sx+170],['数据库',dx+170]].map(([t,x],i)=>`<g clip-path="url(#lc${i})"><text x="${x}" y="812" text-anchor="middle" font-size="54" font-weight="700">${t}</text></g>`).join('');
const spark=`<path id="spark" d="M${bx+352} ${by-12}l16 -24M${bx+366} ${by+16}l30 -10M${bx+326} ${by-20}l2 -30" fill="none" stroke="${OR}" stroke-width="6" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>`;
const steps=STEPS.map((s,i)=>`<g class="step" id="s${i}" transform="translate(${180+i*270} 900)"><path class="mk" d="M-8 6Q75 -4 150 4" stroke="${YE}" stroke-width="30" stroke-linecap="round" fill="none"/><text x="0" y="0" dy="13">${'①②③④⑤⑥'[i]} ${s}</text></g>`).join('');
const envelope=`<g id="env"><path d="M-46 -30L46 -30L46 30L-46 30Z" fill="#fff6d0" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round"/><path d="M-44 -28L0 6L44 -28" fill="none" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/></g>`;
const card=`<g id="card"><path id="cardb" d="M-56 -30Q0 -34 56 -30L58 30Q0 34 -58 30Z" fill="#d6e8ff" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round"/><text id="cardt" class="mono" y="10" text-anchor="middle" font-size="26">{ }</text></g>`;
return `<svg viewBox="0 0 1920 1080" role="img" aria-label="浏览器请求后端并查询数据库的动态图解"><defs>${defs}</defs>
<rect width="1920" height="1080" fill="#fbf7ee"/><rect width="1920" height="1080" filter="url(#grain)" opacity=".12"/>
<g filter="url(#roughT)"><text x="90" y="88" font-size="30" style="fill:#8d8778">程序员青戈 / HTTP请求、后端查询与页面更新</text></g>

<g filter="url(#roughT)" clip-path="url(#titlec)"><text x="90" y="205" font-size="88" font-weight="700">一次请求，数据怎样回来？</text></g>
<g filter="url(#rough)">${legs}${browser}${backend}${db}${spark}</g>
<g filter="url(#roughT)">${labels}${tags}${steps}</g>
${notes}
<text id="sub" x="960" y="1010" text-anchor="middle" font-size="50" font-weight="700" style="paint-order:stroke;stroke:#fbf7ee;stroke-width:12px;stroke-linejoin:round" opacity="0"></text>
<g id="pk" opacity="0" filter="url(#rough)">${envelope}${card}</g>
</svg>`}
const hero=document.querySelector('#hero');hero.innerHTML=art();
const $=s=>hero.querySelector(s),D=s=>document.querySelector(s);
let t=0,playing=false,last=0,seed=0;
function reveal(id,x0,w,p){const r=$(id);r.setAttribute('x',x0);r.setAttribute('width',w*clamp(p))}
D('#seek').max=TOTAL;
// 开场要“画出来”的笔画：每个节点的墨线依次描出，填色稍后淡入
const SKIP='#res,#okB,#okS,#ph';
const INTRO_EL=['browser','backend','db'].map((n,k)=>{const g=$('#n-'+n);
const els=[...g.querySelectorAll('.ink,.ink2')].filter(e=>!e.hasAttribute('stroke-dasharray')&&!e.closest(SKIP));els.forEach(e=>e.setAttribute('pathLength',1));
const fills=[...g.querySelectorAll('.paper,circle:not(.ink),.ink[fill]')].filter(e=>!e.closest(SKIP));return{els,fills,s:.8+k*.8}});
// 画线：p 从 0 到 1；没开始时隐藏，避免圆头端点露出一个点
function drawOn(e,p){p=clamp(p);e.style.visibility=p<=0?'hidden':'visible';e.style.strokeDasharray=p>=1?'none':'1';e.style.strokeDashoffset=1-ease(p)}
function draw(t){
const it=t+INTRO; // 从片头算起的时间
const cue=CUES.find(c=>it>=c[0]&&it<c[1]),sb=$('#sub');sb.textContent=cue?cue[2]:'';sb.setAttribute('opacity',cue&&D('#subOn').checked?1:0);
reveal('#titler',80,1120,(it-.3)/1.8);
INTRO_EL.forEach(({els,fills,s},k)=>{els.forEach(e=>drawOn(e,(it-s)/.7));fills.forEach(e=>e.style.fillOpacity=ease((it-s-.45)/.3));
const lx=[bx,sx,dx][k]+170;reveal('#lcr'+k,lx-110,220,(it-s-.5)/.4)});
// 可选线条抖动，默认关闭。
const sd=D('#boilOn').checked?1+Math.abs(Math.floor(it*3))%5:1;if(sd!==seed){seed=sd;$('#turb').setAttribute('seed',sd);$('#turbT').setAttribute('seed',sd)}
const ph=PHASES.reduce((a,s,i)=>t>=s?i:a,-1);
STEPS.forEach((_,i)=>{const e=$('#s'+i);e.classList.toggle('on',ph>=0&&i===ph);e.classList.toggle('done',i<ph)});
['browser','backend','db'].forEach(n=>{const e=$('#n-'+n),on=ph>=0&&ACTIVE[ph].includes(n);e.classList.toggle('on',on);e.style.opacity=on||ph<0?1:.78});
let shown=false;$('#pk').setAttribute('transform','translate(0 0)');$('#env').style.display='none';$('#card').style.display='none';$('#cardt').textContent='';$('#cardb').setAttribute('fill','#d6e8ff');
LEGS.forEach(([a,b,x1,x2,y,c],i)=>{const p=ease((t-a)/(b-a));
const current=t>=a&&t<=b+.2;
const strength=current?1:.14;
$('#f'+i).setAttribute('stroke-dashoffset',1-p);$('#f'+i).setAttribute('opacity',t>=a?strength:0);$('#h'+i).setAttribute('opacity',p>.98?strength:0);
$('#t'+i).setAttribute('opacity',current&&t>=a?1:0);
if(t>=a&&t<=b){const pk=$('#pk');pk.setAttribute('transform',`translate(${x1+(x2-x1)*p} ${y-10*Math.sin(p*Math.PI)}) rotate(${(i%2?4:-4)*Math.sin(p*Math.PI*2)})`);pk.setAttribute('opacity',1);
$('#env').style.display=i===0?'':'none';$('#card').style.display=i===0?'none':'';
$('#cardb').setAttribute('fill',c===OR?'#fff6d0':'#d6e8ff');$('#cardt').textContent=['','SQL','id=1','{ }'][i];shown=true}});
if(!shown)$('#pk').setAttribute('opacity',0);
// 批注随实际动作出现，不预先展示后续步骤。
NOTES.forEach(([x,y,txt],i)=>{const st=NOTE_ST[i],on=noteOn(i,t,ph),w=txt.length*44+40;reveal('#ncr'+i,x-w/2,w,on?(t-st)/.45:0);drawOn($('#na'+i),on?(t-st-.45)/.25:0)});
drawOn($('#spark'),(t-NARRATION.events.update)/.3);$('#spark').setAttribute('opacity',t<NARRATION.events.complete+.15?1:0);
// 数据库命中
const hit=t>=NARRATION.events.hit&&t<NARRATION.events.return;$('#rec').setAttribute('opacity',hit?.55:0);$('#recT').setAttribute('opacity',hit?1:0);
// 对勾：画出来
const dr=(id,s)=>{$('#'+id).setAttribute('opacity',t>=s?1:0);$('#'+id+'-p').setAttribute('stroke-dashoffset',1-ease((t-s)/.4))};
dr('okS',LEGS[3][1]);$('#okS').setAttribute('opacity',t>=LEGS[3][1]&&t<NARRATION.events.update?1:0);dr('okB',NARRATION.events.complete);
// 结果：占位淡出，名字逐字写出
$('#ph').style.opacity=(1-clamp((t-NARRATION.events.update)/.3))*ease((it-2.2)/.4);$('#res').style.opacity=clamp((t-NARRATION.events.update)/.3);
reveal('#namer',bx+140,130,(t-NARRATION.events.update-.12)/.6);
}
function paint(){draw(t-INTRO);D('#seek').value=t;D('#time').textContent=`${t.toFixed(1)} / ${TOTAL.toFixed(1)} 秒`;D('#play').textContent=playing?'暂停':'播放'}
// 音频是唯一播放时钟；失败时显示错误，不静默播放无声动画。
const aud=new Audio(NARRATION.audio);aud.preload='auto';
const status=D('#player-status');
const startAudio=async()=>{try{aud.currentTime=Math.min(t,aud.duration);await aud.play();playing=true;status.textContent=''}catch(error){playing=false;status.textContent='无法播放配音，请检查音频文件或浏览器权限'}paint()};
D('#play').onclick=()=>{if(playing){aud.pause();playing=false;paint()}else startAudio()};
D('#subOn').onchange=D('#boilOn').onchange=()=>paint();
D('#restart').onclick=()=>{t=0;aud.currentTime=0;if(playing)startAudio();paint()};
D('#seek').oninput=e=>{t=+e.target.value;aud.currentTime=Math.min(t,aud.duration);paint()};
D('#fs').onclick=()=>D('.full').requestFullscreen().catch(()=>{});
aud.addEventListener('ended',()=>{playing=false;t=TOTAL;paint()});
function tick(){if(playing&&!aud.paused){t=aud.currentTime;paint()}requestAnimationFrame(tick)}
window.renderAt=seconds=>{playing=false;aud.pause();t=Math.max(0,Math.min(TOTAL,seconds));paint();return{time:t,duration:TOTAL}};
window.videoTimeline=NARRATION;
window.videoDuration=TOTAL;
window.videoState=()=>({time:t,audioTime:aud.currentTime,audioDuration:aud.duration,rate:aud.playbackRate,paused:aud.paused});
